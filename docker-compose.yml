# Local development database only. Never point production or the legacy
# Actionverse database at this; the db scripts refuse anything but localhost
# for destructive work (see packages/db/scripts/guard.ts).
services:
  postgres:
    image: postgres:17-alpine
    container_name: actiontokens-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: actiontokens
      POSTGRES_PASSWORD: actiontokens
      POSTGRES_DB: actiontokens_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - actiontokens-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actiontokens -d actiontokens_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  actiontokens-dev-pgdata:
